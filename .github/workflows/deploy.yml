name: Databricks Genie CD

on:
  push:
    branches:
      - main
      - staging  # Added staging since your error log mentioned you are pushing to staging
    paths:
      - 'spaces/genie_space.json' # Only runs when the config file changes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Deploy Script
        env:
          # These pull the values from your GitHub Secrets
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          PROD_WAREHOUSE_ID: ${{ secrets.PROD_WAREHOUSE_ID }}
        run: python scripts/deploy_genie.py